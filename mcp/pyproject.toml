[project]
name = "tcm-diagnosis-mcp-server"
version = "0.1.0"
description = "MCP server for TCM tongue screening: photo/live-photo/video intake, pattern matching, patient journal and practitioner reports"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.27.0,<2",
    "numpy>=1.26",
    "pillow>=10.0",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.4.9"]

[project.scripts]
tcm-diagnosis-mcp-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
